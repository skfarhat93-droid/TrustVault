{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="form-shell">
  <span class="eyebrow">ACCOUNT SECURITY</span>
  <h1>Set a new password</h1>
  <p class="muted">Your account must use a new password before you can continue. Choose at least 12 characters.</p>
  <form method="post" class="panel form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    <label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
    <label for="confirmation">Confirm new password</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" required>
    <button class="button button-primary" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
